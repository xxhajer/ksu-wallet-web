{% extends "base.html" %}
{% block title %}Log in - KSU Wallet{% endblock %}
{% block content %}
  <section class="card">
    <h1>Log in</h1>
    <form method="post">
      <label>Student ID or Admin ID
        <input type="text" name="user_id" value="{{ user_id or '' }}" required>
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>
    <p class="muted">No account yet? <a href="{{ url_for('signup') }}">Sign up</a></p>
  </section>
{% endblock %}
